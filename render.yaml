databases:
  - name: petjoy-db
    databaseName: petjoy
    user: petjoy_user
    plan: free

services:
  - type: web
    name: petjoy-app
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn tienda_online.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DATABASE_URL
        fromDatabase:
          name: petjoy-db
          property: connectionString
      # Estas dos las pedirán en el panel de Render al crear el Blueprint
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false