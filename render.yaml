databases:
  - name: tiendaonlinedb
    plan: free
    databaseName: tiendaonline
    user: tiendaonline

services:
  - type: web
    plan: free
    name: tiendaonline
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn tienda_online.asgi:application -k uvicorn.workers.UvicornWorker'      
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tiendaonlinedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 
      - key: STRIPE_SECRET_KEY