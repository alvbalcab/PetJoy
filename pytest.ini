[pytest]
DJANGO_SETTINGS_MODULE = tienda_online.settings
python_files = test*.py
python_classes = *Test
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=productos
    --cov=pedidos
    --cov=clientes
    --cov=core
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing
    --cov-branch
testpaths = 
    productos
    pedidos
    clientes
    core
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
