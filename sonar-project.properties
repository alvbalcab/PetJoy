# SonarQube Configuration for PetJoy Project
# ==========================================

# Project identification
sonar.projectKey=petjoy-tienda-online
sonar.projectName=PetJoy - Tienda Online de Productos para Mascotas
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.inclusions=productos/**/*.py,pedidos/**/*.py,clientes/**/*.py,core/**/*.py,tienda_online/**/*.py

# Test files location
sonar.tests=.
sonar.test.inclusions=**/*test*.py,**/tests.py,**/test_*.py

# Source encoding
sonar.sourceEncoding=UTF-8

# Python specific settings
sonar.python.version=3.13

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/*test*.py,**/tests.py,**/test_*.py,**/migrations/**,**/admin.py,manage.py

# Exclusions
sonar.exclusions=\
    **/migrations/**,\
    **/tests.py,\
    **/test_*.py,\
    **/admin.py,\
    **/manage.py,\
    **/settings.py,\
    **/wsgi.py,\
    **/asgi.py,\
    **/__pycache__/**,\
    **/static/**,\
    **/media/**,\
    **/templates/**,\
    **/venv/**,\
    **/env/**,\
    htmlcov/**,\
    personalizar_petjoy.py,\
    install.sh,\
    install.bat,\
    init_git.sh,\
    .git/**,\
    .scannerwork/**

# Code duplication
sonar.cpd.exclusions=**/migrations/**,**/tests/**

# Quality Gates
sonar.qualitygate.wait=true

# SonarQube Server Configuration
# ================================
sonar.host.url=http://localhost:9000
sonar.token=squ_430f4b9dafdeb4912d4cfe7414b0d94976a58f2e