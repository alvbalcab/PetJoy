{% extends 'base.html' %}

{% block title %}Restablecimiento Completo - PetJoy{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5 text-center">
                    <h1 class="display-4 text-success mb-3"><i class="bi bi-shield-lock-fill"></i></h1>
                    <h3 class="card-title fw-bold">¡Contraseña Restablecida!</h3>
                    
                    <p class="card-text text-muted mt-3">
                        Tu nueva contraseña ha sido establecida con éxito. Ya puedes iniciar sesión con tus nuevas credenciales.
                    </p>
                    
                    <div class="d-grid mt-4">
                        <a href="{% url 'clientes:login' %}" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Ir a Iniciar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
