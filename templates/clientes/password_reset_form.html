{% extends 'base.html' %}
{% block title %}Recuperar Contraseña - PetJoy{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-4 text-center">
                    <h3 class="mb-3"><i class="bi bi-key text-primary"></i> ¿Olvidaste tu clave?</h3>
                    <p class="text-muted mb-4">Introduce tu correo electrónico y te enviaremos instrucciones para restablecerla.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3 text-start">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" required placeholder="ejemplo@petjoy.com">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Enviar Enlace</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
